name: Sync Goodnotes PDFs

on:
  schedule:
    - cron: '0 */6 * * *' # Auto-runs every 6 hours
  workflow_dispatch: # Allows manual run button in GitHub Actions tab

jobs:
  sync-drive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Google Drive API Client
        run: pip install google-api-python-client google-auth

      - name: Download PDFs from Drive
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          # Replace with your actual Goodnotes folder ID from Google Drive URL
          DRIVE_FOLDER_ID: '1mn_i3Vu1T-AMKsbMdTReX8N8pxiG0FRi' 
        run: |
          python -c "
          import os, json, io
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          creds_dict = json.loads(os.environ['SERVICE_ACCOUNT_KEY'])
          creds = Credentials.from_service_account_info(creds_dict, scopes=['https://www.googleapis.com/auth/drive.readonly'])
          service = build('drive', 'v3', credentials=creds)

          folder_id = os.environ['DRIVE_FOLDER_ID']
          results = service.files().list(q=f\"'{folder_id}' in parents and mimeType='application/pdf' and trashed=false\", fields=\"files(id, name)\").execute()
          items = results.get('files', [])

          os.makedirs('assets/notes', exist_ok=True)
          for item in items:
              request = service.files().get_media(fileId=item['id'])
              filepath = os.path.join('assets/notes', item['name'])
              with open(filepath, 'wb') as f:
                  downloader = MediaIoBaseDownload(f, request)
                  done = False
                  while not done:
                      status, done = downloader.next_chunk()
              print(f'Synced: {item[\"name\"]}')
          "

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/notes/
          git diff --staged --quiet || (git commit -m "Auto-update course notes" && git push)
