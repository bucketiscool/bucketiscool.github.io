name: Sync Goodnotes PDFs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-drive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Google Drive API Client
        run: pip install google-api-python-client google-auth

      - name: Download PDFs and Build Manifest
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          DRIVE_FOLDER_ID: '1mn_i3Vu1T-AMKsbMdTReX8N8pxiG0FRi'
        run: |
          import os, json
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          creds_dict = json.loads(os.environ['SERVICE_ACCOUNT_KEY'])
          creds = Credentials.from_service_account_info(creds_dict, scopes=['https://www.googleapis.com/auth/drive.readonly'])
          service = build('drive', 'v3', credentials=creds)

          root_folder_id = os.environ['DRIVE_FOLDER_ID']
          base_dir = 'notes/assets'
          os.makedirs(base_dir, exist_ok=True)

          manifest = []

          folder_results = service.files().list(
              q=f"'{root_folder_id}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false",
              fields="files(id, name)"
          ).execute()
          folders = folder_results.get('files', [])

          if not folders:
              folders = [{'id': root_folder_id, 'name': 'General Notes'}]

          for folder in folders:
              subject_name = folder['name']
              subject_dir = os.path.join(base_dir, subject_name)
              os.makedirs(subject_dir, exist_ok=True)
              
              file_results = service.files().list(
                  q=f"'{folder['id']}' in parents and mimeType='application/pdf' and trashed=false",
                  fields="files(id, name)"
              ).execute()
              files = file_results.get('files', [])

              pdf_list = []
              for f in files:
                  filepath = os.path.join(subject_dir, f['name'])
                  request = service.files().get_media(fileId=f['id'])
                  with open(filepath, 'wb') as pdf_out:
                      downloader = MediaIoBaseDownload(pdf_out, request)
                      done = False
                      while not done:
                          status, done = downloader.next_chunk()
                  
                  pdf_list.append({
                      'title': f['name'].replace('.pdf', ''),
                      'path': f'/notes/assets/{subject_name}/{f["name"]}'
                  })

              if pdf_list:
                  manifest.append({
                      'subject': subject_name,
                      'notes': pdf_list
                  })

          with open(os.path.join(base_dir, 'manifest.json'), 'w') as json_out:
              json.dump(manifest, json_out, indent=2)

          print('Manifest generated successfully in notes/assets!')
        shell: python

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notes/assets/
          git diff --staged --quiet || (git commit -m "Auto-update course notes & manifest" && git push)
